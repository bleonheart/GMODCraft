<!DOCTYPE html>
<html lang="en" style="width:100%;height:100%;background:#000;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1">
<meta name="description" content="Voxelith browser client">
<meta name="keywords" content="voxelith,minecraft,browser,voxel,1.8,1.8.8">
<meta property="og:locale" content="en-US">
<meta property="og:type" content="website">
<meta property="og:title" content="Voxelith">
<meta property="og:description" content="Play Voxelith in your browser">
<title>Voxelith</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
html,body,#voxelith-frame{width:100%;height:100%;margin:0;border:0;background:#000;overflow:hidden}
#voxelith-frame{display:block;visibility:hidden}
</style>
</head>
<body>
<iframe id="voxelith-frame" src="runtime.html" allow="autoplay; fullscreen; pointer-lock" allowfullscreen></iframe>
<script>
"use strict";
(function(){
	const frame=document.getElementById("voxelith-frame");
	const reveal=function(){
		frame.style.visibility="visible";
		frame.focus();
	};
	const prepare=function(){
		let doc;
		try{
			doc=frame.contentDocument||frame.contentWindow.document;
		}catch(_){
			reveal();
			return;
		}
		if(!doc){
			reveal();
			return;
		}
		const skip=doc.getElementById("skipCountdown");
		if(skip) skip.click();
		const wait=function(){
			if(!doc.getElementById("launch_countdown_screen")){
				reveal();
				return;
			}
			setTimeout(wait,25);
		};
		wait();
	};
	frame.addEventListener("load",prepare,{once:true});
})();
</script>
</body>
</html>
